# Modified by ReallyMe Technologies Limited.
[package]
name = "reallyme-buffa-build"
readme = "README.md"
description = "ReallyMe fork: Build-time integration for buffa (use in build.rs)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["protobuf", "protocol-buffers", "build", "codegen"]
categories = ["development-tools::build-utils"]

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "buffa_build"

[dependencies]
buffa = { workspace = true, features = ["std", "fast-utf8"] }
buffa-codegen = { workspace = true }
tempfile = "3"
