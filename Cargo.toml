# Modified by ReallyMe Technologies Limited.
[workspace]
resolver = "2"
members = [
    "buffa",
    "buffa-types",
    "buffa-descriptor",
    "buffa-proto-options",
    "buffa-codegen",
    "buffa-build",
    "buffa-remote-derive",
    "buffa-test",
    "buffa-yaml",
    "protoc-gen-buffa",
    "protoc-gen-buffa-packaging",
    # Executes cleanup fixtures as an actual Wasm module; never published.
    "tests/wasm-erasure",
    # Example/reference crate, not published; kept as a workspace member so
    # buffa-test can depend on it and it inherits the workspace version.
    "examples/buffa-smolstr",
]
exclude = [
    "benchmarks/gen-datasets",
    "benchmarks/buffa",
    "benchmarks/prost",
    "benchmarks/prost-bytes",
    "benchmarks/google",
    "benchmarks/go",
    "examples/addressbook",
    "examples/bsr-quickstart",
    "examples/conflicts",
    "examples/custom-types",
    "examples/envelope",
    "examples/logging",
]

[workspace.package]
version = "0.1.3"
edition = "2021"
rust-version = "1.100"
license = "Apache-2.0"
repository = "https://github.com/reallyme/buffa"
keywords = ["protobuf", "protocol-buffers", "serialization", "no-std", "editions"]
categories = ["encoding", "no-std"]

# Applies to release builds within this workspace (CI-built release binaries,
# benchmarks, conformance). Library consumers do not inherit this — Cargo only
# honors [profile.*] from the top-level workspace, so a project depending on
# buffa/buffa-build must set its own [profile.release] to get LTO.
[profile.release]
lto = true
codegen-units = 1

[workspace.dependencies]
# `default-features = false` so `no_std` members can opt out; Cargo cannot
# re-enable a workspace dependency's defaults per member, so the tooling
# crates spell buffa's default set (`std`, `fast-utf8`) out themselves.
# Keep the two in sync when buffa's `default` list changes.
buffa = { package = "reallyme-buffa", path = "buffa", version = "=0.1.3", default-features = false }
buffa-types = { package = "reallyme-buffa-types", path = "buffa-types", version = "=0.1.3" }
# `default-features = false` keeps the codegen toolchain (`buffa-codegen` /
# `buffa-build` / `protoc-gen-reallyme-buffa`) lean — descriptor types are read at
# codegen time via the binary codec only, never serialised to JSON / text or
# borrowed as views. The generator uses serde/serde_json for bounded adapter
# manifests; descriptor features still avoid their codecs and base64.
# Downstream consumers whose protos reference
# `descriptor.proto` types as fields enable the features they need.
buffa-descriptor = { package = "reallyme-buffa-descriptor", path = "buffa-descriptor", version = "=0.1.3", default-features = false }
buffa-proto-options = { package = "reallyme-buffa-proto-options", path = "buffa-proto-options", version = "=0.1.3" }
buffa-codegen = { package = "reallyme-buffa-codegen", path = "buffa-codegen", version = "=0.1.3" }
buffa-build = { package = "reallyme-buffa-build", path = "buffa-build", version = "=0.1.3" }
buffa-smolstr = { path = "examples/buffa-smolstr", version = "0.1.3" }
buffa-test = { path = "buffa-test", version = "0.1.3" }
base64 = { version = "0.23.1", default-features = false, features = ["alloc"] }
bytes = { version = "1.12.1", default-features = false }
chrono = { version = "0.4.45", default-features = false }
foldhash = { version = "0.2.0", default-features = false }
hashbrown = { version = "0.17.1", default-features = false, features = ["default-hasher"] }
# `jiff` interop for `Timestamp` / `Duration` (the `buffa-types` `jiff`
# feature). Pulled with `default-features = false` + `alloc` so the conversions
# stay `no_std`; `buffa-types`' `std` feature layers `jiff/std` on top.
jiff = { version = "1.0.0", default-features = false, features = ["alloc"] }
once_cell = { version = "1.21.4", default-features = false }
rustversion = { version = "1.0.23" }
# Guarded-field fixtures and the opt-in guarded WKT string owner.
secrecy = { version = "0.10.3", default-features = false }
serde = { version = "1.0.229", default-features = false }
serde_json = { version = "1.0.154", default-features = false, features = ["alloc"] }
serde_norway = { version = "0.9.42" }
arbitrary = { version = "1.5.0", default-features = false, features = ["derive"] }
smoothutf8 = { version = "0.2.3", default-features = false }
subtle = { version = "2.6.1", default-features = false }
thiserror = { version = "2.0.21", default-features = false }
zeroize = { version = "1.9.1", default-features = false, features = ["alloc"] }
# Optional `string` field representations that will be selectable via
# `buffa_build`'s forthcoming `string_type` knob. Declared
# `default-features = false` so they stay `no_std`; the relevant
# `serde`/`arbitrary`/`std` sub-features are turned on by the matching `buffa`
# feature (see buffa/Cargo.toml).
#
smol_str = { version = "0.3.7", default-features = false }
ecow = { version = "0.3.1", default-features = false }
compact_str = { version = "0.10.0", default-features = false }
prettyplease = "0.3.0"
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = { version = "3.0.10", features = ["full"] }
