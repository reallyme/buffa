# Modified by ReallyMe Technologies Limited.
[package]
name = "reallyme-protoc-gen-buffa-packaging"
readme = "README.md"
description = "ReallyMe fork: protoc plugin that emits a mod.rs module tree for buffa per-file output"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["protobuf", "protocol-buffers", "protoc", "plugin", "codegen"]
categories = ["development-tools::build-utils", "command-line-utilities"]

[[bin]]
name = "protoc-gen-reallyme-buffa-packaging"
path = "src/main.rs"

[dependencies]
buffa = { workspace = true, features = ["std", "fast-utf8"] }
buffa-codegen = { workspace = true }

[dev-dependencies]
syn = { workspace = true }
