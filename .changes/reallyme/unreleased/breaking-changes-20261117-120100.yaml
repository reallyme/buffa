kind: Breaking changes
body: 'Messages selected for cleanup (`generate_zeroize(true)` / `zeroize=true`, or `zeroize_in`), and the messages that contain them in the same generation step, no longer get a generated `FooOwnedView` wrapper or `HasMessageView` impl, as if they were also listed in `borrowed_views_only_in`. The wrapper''s `from_owned` encoded the guarded message into ordinary, clonable `Bytes` that were never wiped. This also removes `TimestampOwnedView`, `DurationOwnedView`, `ValueOwnedView`, `StructOwnedView` and `ListValueOwnedView` from `buffa_types::sensitive`. To migrate, replace `FooOwnedView::decode(bytes)` with `buffa::sensitive::GuardedOwnedView::<FooView<''static>>::decode(&bytes, &options)` (or `from_owned(&message, &options)`), which returns `GuardedViewError`, and read fields through `owner.view().field`; the guarded owner is not `Clone`, does not hand out `Bytes`, and implements no JSON itself, so serialize `owner.view()` instead. Code that deliberately accepts unwiped backing storage can still use `buffa::OwnedView::<FooView<''static>>`. Generic code bounded on `HasMessageView`, such as RPC transport glue, no longer accepts these messages. A message whose guarded child is only selected in another generation step, or is an imported guarded type such as `buffa_types::sensitive::Timestamp`, keeps its wrapper unless you also select it with `borrowed_views_only_in`.'
