kind: Fixed
body: |-
    **The JSON policy docs no longer claim that a policy governs every JSON use of a type, and codegen now warns that reflection bypasses policies.** A `ProtoBytesJson` / `ProtoStringJson` policy is consulted only by the generated serde impls. `DynamicMessage::try_from_message` works on any generated message, with or without generated reflection and including messages in the cleanup profile, and `DynamicMessage` JSON (like `to_dynamic` on a reflected message) prints a policy field as standard base64 or a plain string without calling the policy, so a policy that refuses export does not stop it and its import checks do not run; binary encoding and text format never call it either. A policy is therefore not a confidentiality boundary: keep reflective JSON, text and binary output of these messages away from sinks that must not see the values. The trait docs, `json_policy_type` docs, the guide and `docs/guarded-fields.md` now say so, and listing policy types while JSON and reflection are both generated produces the new `CodeGenWarning::JsonPolicyTypesBypassedByReflection`, printed by `buffa-build` as a `cargo:warning` and by the plugin on stderr. `buffa-build` and the plugin always print it, once per generation run, as a reminder rather than a check: without reflection there is no warning, but the bypass remains.
time: 2026-11-17T16:30:00+01:00
