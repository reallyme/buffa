kind: Added
body: 'Cleanup-enabled messages support borrowed inspection through InspectMessage instead of ordinary dynamic snapshots. Inspected scalar and map-key slots wipe their copies on drop, map lookups borrow query keys, diagnostics redact contents, and foreign field descriptors return a fixed typed error. Erased map lookups can be linear; for_each supplies values directly for traversal. Export stays on the owned message JSON path.'
