kind: Fixed
body: |-
    Reflection now emits `ReflectElement` for every generated enum, whatever its openness and in either reflection mode. Previously the impl was emitted only under vtable reflection and only for enums closed by the file's default, so a `repeated` or `map` field of an enum that declares `features.enum_type = CLOSED` in an editions file whose default is open failed to compile with vtable reflection enabled.
    The impl is also needed when a vtable-mode generation reaches an enum through `extern_path` and types it as a closed enum while the owning generation opened it with `open_enums_in` or uses bridge reflection. Regenerating (or upgrading) the crate that owns the enum is enough; the referencing crate needs no change. A crate that worked around the gap with its own `impl ReflectElement` for a generated enum must remove it. A cleanup generation with reflection emits `InspectElement` for every enum on the same rule.
time: 2026-11-13T09:04:51+01:00
