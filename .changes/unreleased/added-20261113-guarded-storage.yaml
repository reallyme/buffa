kind: Added
body: 'Provide opt-in wipe-owning lists, stable map allocations, view storage and bounded formatting support for secret-bearing protobuf fields. Collections erase released and outgrown storage. List mutation exposes only individual elements and an iterator that cannot yield a mutable slice, preventing allocating slice algorithms from staging unguarded copies.'
