# Modified by ReallyMe Technologies Limited.
name: Attach protoc plugin binaries

# Manually dispatch after crates.io publication creates the GitHub release.
# Builds protoc-gen-reallyme-buffa and protoc-gen-reallyme-buffa-packaging for
# Linux (x86_64, aarch64), macOS (x86_64, aarch64), and Windows (x86_64).
# Attaches binaries and SHA-256 checksums to that existing GitHub release, with
# SLSA build provenance attestations, and cosign signatures.

on:
  # Dispatch explicitly for an existing approved ReallyMe release tag.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing published ReallyMe tag to build (e.g. reallyme-v0.1.0)"
        required: true
        type: string

permissions:
  contents: read

env:
  # Both binaries share the protoc-gen-reallyme-buffa prefix, so every glob
  # in the release/sign/attest steps that matches one matches both.
  BINARY_PREFIX: protoc-gen-reallyme-buffa
  BINARIES: protoc-gen-reallyme-buffa protoc-gen-reallyme-buffa-packaging
  # The existing tag selected for this manual release.
  RELEASE_TAG: ${{ inputs.tag }}

jobs:
  verify:
    if: github.repository == 'reallyme/buffa'
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.tag.outputs.commit }}
      notes: ${{ steps.tag.outputs.notes }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 (sha-pinned)
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - name: Verify existing tag and matching package version
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          if [[ "$RELEASE_TAG" != "reallyme-v$version" ]]; then
            echo '::error::Release tag and package version differ.'
            exit 1
          fi
          tag_commit=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")
          if [[ "$tag_commit" != "$(git rev-parse HEAD)" ]]; then
            echo '::error::Release tag does not identify the checked-out source.'
            exit 1
          fi
          notes=".changes/reallyme/$version.md"
          test -f "$notes"
          echo "commit=$tag_commit" >> "$GITHUB_OUTPUT"
          echo "notes=$notes" >> "$GITHUB_OUTPUT"
      - name: Require the GitHub release created after crate publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          existing_tag_name=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName --jq '.tagName')
          is_draft=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')
          if [[ "$existing_tag_name" != "$RELEASE_TAG" || "$is_draft" != false ]]; then
            echo '::error::Publish the crates and finalize the GitHub release first.'
            exit 1
          fi

  build:
    needs: verify
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            name: linux-x86_64
            ext: ""
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            name: linux-aarch64
            ext: ""
          - target: x86_64-apple-darwin
            os: macos-latest
            name: darwin-x86_64
            ext: ""
          - target: aarch64-apple-darwin
            os: macos-latest
            name: darwin-aarch64
            ext: ""
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            name: windows-x86_64
            ext: ".exe"

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 (sha-pinned)
        with:
          ref: ${{ needs.verify.outputs.commit }}
          persist-credentials: false

      # Must name the same toolchain version as rust-toolchain.toml: that
      # file overrides the action-installed default when cargo runs, so a
      # cross-compile target installed on @stable is bypassed and the build
      # fails with E0463 (this bit the v0.7.1 darwin-x86_64 job). Keep in
      # sync with rust-toolchain.toml and ci.yml; bump together.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@46817827a5bfabe028bf34e1cce71fd40e2ff697 # 1.95.0 (sha-pinned)
        with:
          targets: ${{ matrix.target }}

      # musl cross-compilation tools for Linux targets.
      - name: Install musl tools (Linux)
        if: contains(matrix.target, 'linux')
        env:
          TARGET: ${{ matrix.target }}
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          # For aarch64 cross-compilation
          if [[ "$TARGET" == "aarch64"* ]]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          fi

      - name: Build
        env:
          TARGET: ${{ matrix.target }}
        run: |
          for bin in $BINARIES; do
            cargo build --locked --release --target "$TARGET" --bin "$bin"
          done

      - name: Package
        env:
          TARGET: ${{ matrix.target }}
          PLATFORM_NAME: ${{ matrix.name }}
          EXT: ${{ matrix.ext }}
        run: |
          mkdir -p dist
          for bin in $BINARIES; do
            asset="${bin}-${RELEASE_TAG}-${PLATFORM_NAME}${EXT}"
            cp "target/${TARGET}/release/${bin}${EXT}" "dist/${asset}"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2 (sha-pinned)
        with:
          name: ${{ matrix.name }}
          path: dist/*

  release:
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 (sha-pinned)
        with:
          ref: ${{ needs.verify.outputs.commit }}
          persist-credentials: false

      - name: Verify the tag still identifies the built source
        shell: bash
        run: |
          set -euo pipefail
          remote_tag=$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}")
          tag_commit=$(printf '%s\n' "$remote_tag" | awk 'END { print $1 }')
          if [[ "$tag_commit" != "$(git rev-parse HEAD)" ]]; then
            echo '::error::Release tag changed after validation.'
            exit 1
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0 (sha-pinned)
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        working-directory: artifacts
        run: |
          sha256sum ${{ env.BINARY_PREFIX }}-* > checksums-sha256.txt
          cat checksums-sha256.txt

      # GitHub-native signed SLSA provenance. Stored in the GitHub
      # attestation API, verifiable without downloading sig/pem:
      #   gh attestation verify <binary> --repo <owner>/buffa
      #
      # Runs before cosign so the glob matches only the binaries.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2 (sha-pinned)
        with:
          subject-path: artifacts/${{ env.BINARY_PREFIX }}-*

      - name: Install cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1 (sha-pinned)

      - name: Sign artifacts with cosign (keyless)
        working-directory: artifacts
        env:
          BINARY_PREFIX: ${{ env.BINARY_PREFIX }}
        run: |
          for file in "${BINARY_PREFIX}"-*; do
            cosign sign-blob --yes \
              --output-signature "${file}.sig" \
              --output-certificate "${file}.pem" \
              "$file"
          done

      - name: Attach assets to the existing published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null
          for file in artifacts/"${BINARY_PREFIX}"-* artifacts/checksums-sha256.txt; do
            asset_name="${file##*/}"
            if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
                --json assets --jq '.assets[].name' | grep -Fxq "$asset_name"; then
              gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" "$file"
            fi
          done
