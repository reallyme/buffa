# Modified by ReallyMe Technologies Limited.
name: Publish to crates.io
run-name: ReallyMe crates ${{ inputs.dry_run && 'preflight' || 'release' }} @ ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Verify all packages without uploading or using registry credentials
        type: boolean
        default: true

permissions:
  contents: read

# Two versions must not race to create or upload members of this package family.
concurrency:
  group: reallyme-crates-release
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  verify-source:
    if: github.repository == 'reallyme/buffa'
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      version: ${{ steps.source.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@46817827a5bfabe028bf34e1cce71fd40e2ff697 # 1.95.0
      - name: Verify release source, namespace and version
        id: source
        env:
          PUBLISHING: ${{ !inputs.dry_run }}
        run: |
          args=()
          if [[ "$PUBLISHING" == true ]]; then args+=(--publishing); fi
          python3 scripts/release_support.py source "${args[@]}"

  checks:
    needs: verify-source
    # Local reusable workflows run from the caller's commit. No registry secret
    # is inherited, including when this job runs for an actual release.
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  package-preflight:
    needs: verify-source
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/package-preflight
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.verify-source.outputs.commit }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@46817827a5bfabe028bf34e1cce71fd40e2ff697 # 1.95.0
      - name: Build and verify every package without registry credentials
        shell: bash
        run: |
          set -euo pipefail
          packages=$(bash scripts/check-publish-coverage.sh --list)
          args=()
          while read -r package; do args+=(--package "$package"); done <<< "$packages"
          cargo publish --registry crates-io --dry-run --locked --all-features "${args[@]}"
          # Cargo's dry run retains temporary staging archives, not the final
          # target/package files. Materialize those after their builds pass.
          cargo package --registry crates-io --no-verify --locked --all-features "${args[@]}"
          python3 scripts/release_support.py snapshot --directory "$RUNNER_TEMP/reviewed-crates"
      - name: Retain reviewed archives and checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reallyme-crates-${{ needs.verify-source.outputs.commit }}
          path: ${{ runner.temp }}/reviewed-crates/
          if-no-files-found: error
          retention-days: 30

  publish:
    if: ${{ !inputs.dry_run }}
    needs: [verify-source, checks, package-preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/release-upload
      HAS_BOOTSTRAP_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.verify-source.outputs.commit }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@46817827a5bfabe028bf34e1cce71fd40e2ff697 # 1.95.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: reallyme-crates-${{ needs.verify-source.outputs.commit }}
          path: ${{ runner.temp }}/reviewed-crates
      - name: Recheck main and reproduce archives without executing build scripts
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/release_support.py source --publishing
          packages=$(bash scripts/check-publish-coverage.sh --list)
          args=()
          while read -r package; do args+=(--package "$package"); done <<< "$packages"
          cargo package --registry crates-io --no-verify --locked --all-features "${args[@]}"
          python3 scripts/release_support.py verify --publishing --directory "$RUNNER_TEMP/reviewed-crates"
      # New package names need a bootstrap token. Once every package has a
      # matching trusted publisher, remove the secret to select short-lived OIDC.
      - name: Authenticate with Trusted Publishing
        id: auth
        if: env.HAS_BOOTSTRAP_TOKEN != 'true'
        uses: rust-lang/crates-io-auth-action@bbd81622f20ce9e2dd9622e3218b975523e45bbe # v1.0.4
      - name: Upload the verified packages in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || steps.auth.outputs.token }}
        run: python3 scripts/publish_crates.py --directory "$RUNNER_TEMP/reviewed-crates"

  finalize:
    name: Tag and create GitHub release
    if: ${{ !inputs.dry_run }}
    needs: [verify-source, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_SHA: ${{ needs.verify-source.outputs.commit }}
      RELEASE_VERSION: ${{ needs.verify-source.outputs.version }}
    steps:
      - name: Checkout the published release commit without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.verify-source.outputs.commit }}
          persist-credentials: false
      - name: Download reviewed publication evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: reallyme-crates-${{ needs.verify-source.outputs.commit }}
          path: ${{ runner.temp }}/reviewed-crates
      # Keep the same finalization order as the other ReallyMe Rust repos:
      # successful crates.io publication first, then the immutable tag/release.
      - name: Create release tag through the GitHub API
        id: release-tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="reallyme-v${RELEASE_VERSION}"
          # Query only tags: the commits API can also resolve a same-named branch.
          remote_tag=$(git ls-remote --tags origin "refs/tags/$tag" "refs/tags/$tag^{}")
          existing_commit=$(printf '%s\n' "$remote_tag" | awk -v ref="refs/tags/$tag" '
            $2 == ref { direct = $1 }
            $2 == ref "^{}" { peeled = $1 }
            END { print (peeled != "" ? peeled : direct) }
          ')
          if [[ -n "$existing_commit" && "$existing_commit" != "$RELEASE_SHA" ]]; then
            echo '::error::Release tag already identifies a different commit.'
            exit 1
          fi
          if [[ -z "$existing_commit" ]]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              --field ref="refs/tags/$tag" \
              --field sha="$RELEASE_SHA" > /dev/null
          fi
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
      - name: Create GitHub release after publication
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release-tag.outputs.tag }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "Release $RELEASE_VERSION" \
              --notes-file ".changes/reallyme/$RELEASE_VERSION.md"
          fi
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --json assets --jq '.assets[].name' | grep -Fxq release.json; then
            gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              "$RUNNER_TEMP/reviewed-crates/release.json"
          fi
