# Modified by ReallyMe Technologies Limited.
name: Publish to crates.io

# Publishes all workspace crates to crates.io in dependency order.
#
# Auth: uses the CARGO_REGISTRY_TOKEN secret when present (bootstrap path —
# crates.io can't configure Trusted Publishing for a crate that doesn't exist
# yet), otherwise exchanges the GitHub OIDC token for a short-lived crates.io
# token. Once Trusted Publishing is configured per crate and the secret is
# removed, publishes run entirely over OIDC with no stored credentials.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: >-
          Run the workspace publication checks without uploading or authenticating.
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write  # OIDC for crates.io Trusted Publishing

jobs:
  publish:
    if: github.repository == 'reallyme/buffa'
    runs-on: ubuntu-latest
    # GitHub Environment: part of the Trusted Publishing trust config on
    # crates.io, and lets you add a required-reviewer approval gate.
    environment: crates-io
    env:
      DRY_RUN_FLAG: ${{ inputs.dry_run && '--dry-run' || '' }}
      # Bootstrap token. Empty if secret is unset → Trusted Publishing path.
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 (sha-pinned)

      - uses: dtolnay/rust-toolchain@46817827a5bfabe028bf34e1cce71fd40e2ff697 # 1.95.0 (sha-pinned)

      - name: Verify approved tag for an actual upload
        if: ${{ !inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != refs/tags/reallyme-v* ]]; then
            echo '::error::Actual publication must run from the approved ReallyMe release tag.'
            exit 1
          fi
          version=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "reallyme-buffa") | .version')
          if [[ "$GITHUB_REF_NAME" != "reallyme-v$version" ]]; then
            echo '::error::Release tag and package version differ.'
            exit 1
          fi

      # OIDC token exchange. Skipped in dry-run (no authentication or upload) and
      # bootstrap (secret present). The action's post-step revokes the token.
      - name: Authenticate (Trusted Publishing)
        id: auth
        if: ${{ !inputs.dry_run && env.CARGO_REGISTRY_TOKEN == '' }}
        uses: rust-lang/crates-io-auth-action@bbd81622f20ce9e2dd9622e3218b975523e45bbe # v1.0.4 (sha-pinned)

      - name: Use Trusted Publishing token
        if: ${{ steps.auth.outputs.token != '' }}
        run: echo "CARGO_REGISTRY_TOKEN=${{ steps.auth.outputs.token }}" >> "$GITHUB_ENV"

      # .github/publish-order.txt is the single source of truth for what ships
      # and in what order; scripts/check-publish-coverage.sh diffs it against
      # the publishable workspace members and fails when a crate is listed
      # before a workspace crate it depends on. The same check runs on every pull
      # request (ci.yml), so a new crate is caught when it is introduced rather
      # than at release time — buffa-remote-derive shipped announced in the
      # 0.9.0 changelog but absent from crates.io because nothing compared the
      # list to the workspace.
      #
      - name: Check every publishable crate is covered
        run: ./scripts/check-publish-coverage.sh

      - name: Publish or verify the selected workspace packages
        shell: bash
        run: |
          set -euo pipefail
          args=()
          packages=$(./scripts/check-publish-coverage.sh --list)
          while read -r package; do
            case "$package" in
              reallyme-*) args+=(--package "$package") ;;
              *) echo '::error::Publication list contains a package outside the fork namespace.'; exit 1 ;;
            esac
          done <<< "$packages"
          if [[ ${#args[@]} -eq 0 ]]; then
            echo '::error::Publication list is empty.'
            exit 1
          fi
          if [[ -n "$DRY_RUN_FLAG" ]]; then
            args+=(--dry-run)
          fi
          cargo publish --locked "${args[@]}"
