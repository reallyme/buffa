name: Crates Package Preflight

run-name: Crates package preflight ${{ inputs.version }} @ ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without a leading v
        required: true
        type: string
        default: 0.1.1

concurrency:
  group: crates-package-preflight-${{ inputs.version }}-${{ github.sha }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  verify-source-sha:
    name: Verify release source
    if: github.repository == 'reallyme/buffa' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      release_sha: ${{ steps.verify-source.outputs.commit }}
      release_version: ${{ steps.verify-source.outputs.version }}
    steps:
      - name: Checkout requested release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: reallyme/buffa

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@46817827a5bfabe028bf34e1cce71fd40e2ff697 # 1.95.0

      - name: Match workflow head, current main, and crate versions
        id: verify-source
        env:
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_SOURCE_WRITE_GITHUB_OUTPUT: '1'
        working-directory: reallyme/buffa
        run: python3 scripts/release_support.py source --publishing

  crates-package:
    name: Review crates.io packages
    needs: verify-source-sha
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout certified release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify-source-sha.outputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false
          path: reallyme/buffa

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'

      - name: Verify full Rust CI for the release commit
        id: rust-ci
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.verify-source-sha.outputs.release_sha }}
          RELEASE_VERSION: ${{ needs.verify-source-sha.outputs.release_version }}
          RELEASE_ATTESTATION_RUST_CI_ONLY: '1'
          RELEASE_ATTESTATION_WRITE_GITHUB_OUTPUT: '1'
          RELEASE_ATTESTATION_WAIT_SECONDS: '3600'
          RELEASE_ATTESTATION_POLL_SECONDS: '20'
        working-directory: reallyme/buffa
        run: node scripts/verify_release_attestation.mjs

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@46817827a5bfabe028bf34e1cce71fd40e2ff697 # 1.95.0

      - name: Inspect and verify the Buffa package set
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/package-target
          PYTHONDONTWRITEBYTECODE: '1'
        working-directory: reallyme/buffa
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/check-publish-coverage.sh
          packages=$(bash scripts/check-publish-coverage.sh --list)
          args=()
          while read -r package; do args+=(--package "$package"); done <<< "$packages"
          cargo publish --registry crates-io --dry-run --locked --all-features "${args[@]}"
          cargo package --registry crates-io --no-verify --locked --all-features "${args[@]}"
          python3 scripts/release_support.py snapshot --directory "$RUNNER_TEMP/reviewed-crates"

      - name: Write reviewed package attestation
        env:
          RELEASE_SHA: ${{ needs.verify-source-sha.outputs.release_sha }}
          RELEASE_VERSION: ${{ needs.verify-source-sha.outputs.release_version }}
          RUST_CI_RUN_ID: ${{ steps.rust-ci.outputs.rust_ci_run_id }}
        working-directory: reallyme/buffa
        run: node scripts/write_release_attestation.mjs

      - name: Upload reviewed package attestation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reallyme-buffa-crates-preflight-${{ inputs.version }}-${{ github.sha }}
          path: reallyme/buffa/release-attestation/crates-preflight.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload reviewed crate archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reallyme-buffa-crate-archives-${{ inputs.version }}-${{ github.sha }}
          path: ${{ runner.temp }}/reviewed-crates/
          if-no-files-found: error
          retention-days: 30

  attest-reviewed-evidence:
    name: Attest reviewed package evidence
    needs: [verify-source-sha, crates-package]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Download reviewed package attestation
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: reallyme-buffa-crates-preflight-${{ inputs.version }}-${{ github.sha }}
          path: release-attestation

      - name: Download reviewed crate archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: reallyme-buffa-crate-archives-${{ inputs.version }}-${{ github.sha }}
          path: reviewed-crates

      - name: Cryptographically attest reviewed package evidence
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-attestation/crates-preflight.json

      - name: Cryptographically attest reviewed crate archives
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: reviewed-crates/*.crate

      - name: Summarize reviewed release
        env:
          RELEASE_SHA: ${{ needs.verify-source-sha.outputs.release_sha }}
          RELEASE_VERSION: ${{ needs.verify-source-sha.outputs.release_version }}
        run: |
          {
            echo '## Crates package preflight passed'
            echo
            echo "- Version: \`${RELEASE_VERSION}\`"
            echo "- Commit: \`${RELEASE_SHA}\`"
            echo "- Publish set: 9 ReallyMe Buffa crates in verified dependency order"
            echo '- Conformance and regeneration checks: covered by the verified full CI run'
            echo "- Attestation run ID: \`${GITHUB_RUN_ID}\`"
          } >> "$GITHUB_STEP_SUMMARY"
