# Modified by ReallyMe Technologies Limited.
[package]
name = "conformance"
description = "Protobuf conformance test runner for buffa"
version = "0.1.0"
edition = "2021"
rust-version = "1.100"
license = "Apache-2.0"
publish = false

# Intentionally NOT in the root workspace — this crate requires proto files
# in conformance/protos/ that are generated by the Docker build or via
# `task fetch-protos`. Keeping it standalone prevents the workspace lint and
# test targets from failing on machines where the protos have not been
# fetched.
#
# Build inside Docker:
#   task conformance
#
# Build locally (after fetching protos):
#   task fetch-protos
#   cargo build --manifest-path conformance/Cargo.toml

# Prevent cargo from treating this as part of the parent workspace.
[workspace]

[features]
default = ["buffa-std"]
# `reflect` enables vtable-mode reflection on the generated view types and the
# WKT views (BUFFA_VIA_VTABLE run). It requires std, so it rides on `buffa-std`
# (the default) and is absent from the `--no-default-features` no_std binary —
# whose generated code therefore omits the reflect impls.
buffa-std = ["buffa/std", "buffa-types/std", "reflect"]
reflect = ["buffa-types/reflect"]
# Generates the test messages with `CodecStrategy::Table`, for the via-table
# run. The workspace MSRV includes `offset_of!`, which the table codec uses.
table = []

[dependencies]
buffa = { package = "reallyme-buffa", path = "../buffa", version = "=0.1.2", default-features = false, features = ["json", "text"] }
buffa-types = { package = "reallyme-buffa-types", path = "../buffa-types", version = "=0.1.2", default-features = false, features = ["json"] }
buffa-descriptor = { package = "reallyme-buffa-descriptor", path = "../buffa-descriptor", version = "=0.1.2", default-features = false, features = ["reflect", "json", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["std", "float_roundtrip"] }

[build-dependencies]
buffa-build = { package = "reallyme-buffa-build", path = "../buffa-build", version = "=0.1.2" }
