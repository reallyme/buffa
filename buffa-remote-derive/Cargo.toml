# Modified by ReallyMe Technologies Limited.
[package]
name = "reallyme-buffa-remote-derive"
readme = "README.md"
description = "ReallyMe fork: Derive macros that implement buffa's pluggable owned-type traits (ProtoString, ProtoBytes, ProtoList, ProtoBox, MapStorage) for a newtype wrapping a foreign remote type"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["protobuf", "protocol-buffers", "derive"]
categories = ["encoding"]

[lib]
name = "buffa_remote_derive"
proc-macro = true

[dependencies]
proc-macro2 = { workspace = true }
quote = { workspace = true }
syn = { workspace = true }

[dev-dependencies]
arbitrary = { workspace = true }
buffa = { workspace = true, features = ["std", "json"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
ecow = { workspace = true }
smallvec = { version = "1", default-features = false }
smallbox = { version = "0.8", default-features = false }
indexmap = { version = "2", default-features = false, features = ["std", "serde"] }
syn = { workspace = true, features = ["visit"] }
