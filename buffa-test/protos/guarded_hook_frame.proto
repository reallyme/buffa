syntax = "proto3";
package guarded_hook_frame;

// The decode_hook_frame shapes with guarded representations and message
// cleanup: a guarded field's length must be checked against the message that
// holds it before the representation copies the payload.
message Inner {
  string s = 1;
  bytes b = 2;
  repeated string rs = 3;
  map<string, string> m = 4;
  oneof choice {
    string os = 5;
  }
  optional string opt = 6;
  repeated bytes rb = 7;
  map<int32, bytes> mb = 8;
}

message Outer {
  Inner inner = 1;
  string after = 2;
}
